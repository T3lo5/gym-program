# Gradle properties
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true

# Android
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# Compose Compiler (for Kotlin 1.9.24)
androidx.compose.compiler.version=1.5.14

# Espelho do Maven Central para o android-all do Robolectric. O Maven Central
# devolve HTTP 429 para alguns IPs do GitHub Actions, fazendo o download travar
# e exceder o timeout do CI. Veja AGENTS.md > Ambiente.
robolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2