services:
  treinos-backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: treinos-backend
    # Roda como root porque o bind mount ./back/data:/app/data fica com dono root
    # neste host (sistema de arquivos compartilhado de VM não permite chown).
    # Como appuser (UID 1000) não consegue gravar na pasta root-owned, o SQLite
    # falharia com "unable to open database file".
    user: "0:0"
    ports:
      - "3000:3000"
    env_file:
      - ./back/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/treinos.db
      # O Docker bridge não consegue anunciar mDNS na rede local.
      # Use a execução nativa (sem Docker) se precisar de descoberta automática.
      - MDNS_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Reflete alterações no código após reiniciar o container.
      - ./back/app:/app/app
      # Persiste o SQLite do backend no computador.
      - ./back/data:/app/data
    restart: unless-stopped
    networks:
      - treinos-network

networks:
  treinos-network:
    driver: bridge