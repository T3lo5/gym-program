services:
  treinos-backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: treinos-backend
    # Roda como root porque o bind mount ./back/data:/app/data fica com dono root
    # neste host (sistema de arquivos compartilhado de VM não permite chown).
    # Como appuser (UID 1000) não consegue gravar na pasta root-owned, o SQLite
    # falharia com "unable to open database file".
    user: "0:0"
    ports:
      - "3000:3000"
    env_file:
      - ./back/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/treinos.db
      # O Docker bridge não consegue anunciar mDNS na rede local.
      # Use a execução nativa (sem Docker) se precisar de descoberta automática.
      - MDNS_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Reflete alterações no código após reiniciar o container.
      - ./back/app:/app/app
      # Persiste o SQLite do backend no computador.
      - ./back/data:/app/data
    restart: unless-stopped
    networks:
      - treinos-network

  # Grafo de memória compartilhado por todos os agentes que abrem este projeto.
  # Estado local em .mcp-memory/ (ignorado pelo git), um diretório porque bind
  # mount de arquivo inexistente vira diretório no host.
  mcp-memory:
    build:
      context: ./tools/mcp-memory
      dockerfile: Dockerfile
    container_name: treinos-mcp-memory
    # Grava com o UID do host para o JSONL não virar root-owned. Ajuste
    # MCP_MEMORY_UID/GID se `id -u`/`id -g` não forem 1000.
    user: "${MCP_MEMORY_UID:-1000}:${MCP_MEMORY_GID:-1000}"
    ports:
      # Só localhost: a memória não deve ficar exposta na rede.
      - "127.0.0.1:8765:8765"
    environment:
      - MEMORY_FILE_PATH=/data/memory.jsonl
    volumes:
      - ./.mcp-memory:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - treinos-network

networks:
  treinos-network:
    driver: bridge