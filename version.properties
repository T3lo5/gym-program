# Fonte única do versionName do app (celular e relógio).
#
# O versionCode NÃO fica aqui: é derivado do tempo por scripts/version.sh
# (minutos desde 2020-01-01T00:00:00Z), igual no CI e no build local, para o
# updater in-app (H3-51) e o `adb install -r` nunca esbarrarem em downgrade.
#
# Ao fechar uma release, mude só esta linha:
# feat -> +1 no componente menor; fix -> +1 no componente patch;
# breaking incompatível -> +1 no componente maior.
versionName=1.12.0
