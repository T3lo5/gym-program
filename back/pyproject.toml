[tool.ruff]
line-length = 120
target-version = "py311"

# Regras mínimas e objetivas: erros de sintaxe, nomes indefinidos e imports
# quebrados. São exatamente os erros que passam silenciosamente em um build
# sem lint e só explodem em runtime.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
