name: Android CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: .

    steps:
      # ============================================================
      # 1. Checkout e setup JDK
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ============================================================
      # 2. Cache Gradle dependencies
      # ============================================================
      - name: Cache Gradle modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ============================================================
      # 3. Build APKs
      # ============================================================
      - name: Assemble debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --info

      # ============================================================
      # 4. Upload APKs as artifacts
      # ============================================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # ============================================================
      # 5. (Opcional) Assinar APK com keystore fixo
      # ============================================================
      - name: Sign debug APK (se necessário)
        if: false  # Debug usa keystore padrão do Android, não precisa assinar
        run: |
          echo "Debug APKs já são assinados automaticamente pelo Android Gradle Plugin"
          echo "Para assinar release, use: ./gradlew signingReport"

      # ============================================================
      # 6. Informações úteis
      # ============================================================
      - name: Build summary
        run: |
          echo "=== Build Status ==="
          echo "Debug APK: $(ls -la app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || echo 'Not found')"
          echo "Release APK: $(ls -la app/build/outputs/apk/release/app-release.apk 2>/dev/null || echo 'Not found')"