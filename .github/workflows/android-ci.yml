name: Android Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Only one release at a time; never cancel a running release.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      signed: ${{ steps.signing.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------------
      # Signing material
      # ------------------------------------------------------------------
      - name: Decode release keystore
        id: signing
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release signing skipped::RELEASE_KEYSTORE_BASE64 is not set. The APK will be unsigned and cannot be published as signed release."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Compute version
        id: version
        run: |
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION_NAME (versionCode ${GITHUB_RUN_NUMBER})"

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build debug APK (pull requests)
        if: ${{ github.event_name == 'pull_request' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Verify APK signature
        if: ${{ steps.signing.outputs.enabled == 'true' && github.event_name != 'pull_request' }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -q "Verified using" signature.txt

      - name: Compute checksums
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true' }}
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Upload debug APK
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-pr-${{ github.event.number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release APK
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "### Android build"
            echo ""
            for f in app/build/outputs/apk/*/*.apk; do
              [ -f "$f" ] || continue
              echo "- \`$f\` ($(du -h "$f" | cut -f1))"
            done
            echo ""
            echo "Signed: ${{ steps.signing.outputs.enabled == 'true' && 'yes' || 'no (RELEASE_KEYSTORE_BASE64 missing)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'branch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-${{ needs.build.outputs.version_name }}
          path: dist

      - name: Verify APK is signed before publishing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner > /dev/null 2>&1 || true
          if command -v apksigner > /dev/null; then
            apksigner verify --verbose dist/app-release.apk
          else
            echo "apksigner not found, relying on build verification"
          fi

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=latest
          TITLE="Treinos — latest build"
          NOTES=$(cat <<EOF
          Release automático gerado a partir de \`${GITHUB_SHA::7}\`.

          **Versão:** ${{ needs.build.outputs.version_name }} (versionCode ${{ needs.build.outputs.version_code }})

          **Download direto:** https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-release.apk

          O APK é assinado com a chave de release estável, pronto para atualização direta.
          EOF
          )

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            dist/app-release.apk dist/app-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
