name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Uma execução por branch/PR. Um commit novo cancela o build anterior.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
      short-sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Mantém a mesma chave de debug entre execuções. Assim um APK novo
      # instala por cima do anterior, sem precisar desinstalar.
      - name: Cache debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Make scripts executable
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/*.sh

      - name: Compute version
        id: version
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            NAME="0.0.${CODE}-pr${{ github.event.pull_request.number }}"
          fi

          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Mesmo script que os agentes rodam dentro do Docker local
      # (./scripts/verify.sh). Build + testes unitários + Android Lint +
      # verificação de assinatura + artifact com checksum.
      - name: Verify APK (build, tests, lint, signature)
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./scripts/ci-android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: treinos-apk
          path: dist/
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "### Android APK pronto"
            echo ""
            echo "- Versão: \`${{ steps.version.outputs.name }}\` (versionCode ${{ steps.version.outputs.code }})"
            echo "- Commit: \`${{ steps.version.outputs.short-sha }}\`"
            echo "- App APK: \`dist/treinos.apk\` ($(du -h dist/treinos.apk | cut -f1))"
            echo "- Wear APK: \`dist/wear.apk\` ($(du -h dist/wear.apk | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      # Mesmo comando local: ./scripts/verify.sh (etapa backend).
      - name: Verify backend (lint, import, tests)
        run: ./scripts/ci-backend.sh

  release:
    name: Publish GitHub Release
    needs: [build, backend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: treinos-apk
          path: dist

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          TITLE="Treinos — build ${{ needs.build.outputs.version-name }}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/treinos.apk"
          WEAR_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/wear.apk"

          cat > release-notes.md <<EOF
          Build automático do commit \`${{ needs.build.outputs.short-sha }}\`.

          - **Versão:** ${{ needs.build.outputs.version-name }} (versionCode ${{ needs.build.outputs.version-code }})
          - **App APK:** ${DOWNLOAD_URL}
          - **Wear APK:** ${WEAR_DOWNLOAD_URL}
          - **APKs:** debug (prontos para testes)

          Para instalar: baixe o \`treinos.apk\` (celular) e/ou o \`wear.apk\` (relógio) e abra no dispositivo.
          Se o Android pedir permissão, autorize a instalação de fontes desconhecidas.

          Verifique o checksum com os arquivos \`treinos.apk.sha256\` e \`wear.apk.sha256\`.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/treinos.apk dist/treinos.apk.sha256 \
              dist/wear.apk dist/wear.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" \
              dist/treinos.apk dist/treinos.apk.sha256 \
              dist/wear.apk dist/wear.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --latest
          fi
