name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Uma execução por branch/PR. Em PR, cancela builds antigos.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
      short-sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Mantém a mesma chave de debug entre execuções. Assim um APK novo
      # instala por cima do anterior, sem precisar desinstalar.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute version
        id: version
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            NAME="0.0.${CODE}-pr${{ github.event.pull_request.number }}"
          fi

          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: >-
          ./gradlew :app:assembleDebug
          --no-daemon
          --stacktrace
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Verify APK signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/treinos.apk
          (cd dist && sha256sum treinos.apk > treinos.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: treinos-apk
          path: dist/
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "### Android APK pronto"
            echo ""
            echo "- Versão: \`${{ steps.version.outputs.name }}\` (versionCode ${{ steps.version.outputs.code }})"
            echo "- Commit: \`${{ steps.version.outputs.short-sha }}\`"
            echo "- APK: \`dist/treinos.apk\` ($(du -h dist/treinos.apk | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: treinos-apk
          path: dist

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          TITLE="Treinos — build ${{ needs.build.outputs.version-name }}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/treinos.apk"

          cat > release-notes.md <<EOF
          Build automático do commit \`${{ needs.build.outputs.short-sha }}\`.

          - **Versão:** ${{ needs.build.outputs.version-name }} (versionCode ${{ needs.build.outputs.version-code }})
          - **Download direto:** ${DOWNLOAD_URL}
          - **APK:** debug (pronto para testes)

          Para instalar: baixe o \`treinos.apk\` e abra no celular.
          Se o Android pedir permissão, autorize a instalação de fontes desconhecidas.

          Verifique o checksum com o arquivo \`treinos.apk.sha256\`.
          EOF

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            dist/treinos.apk dist/treinos.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest
